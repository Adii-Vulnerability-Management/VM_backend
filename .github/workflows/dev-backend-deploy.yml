name: GRC3 Product DEV Backend - Deploy (SSM + PM2)

on:
  push:
    branches:
      - dev-env

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      # ---------------------------------
      # 1. Checkout repo
      # ---------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------
      # Slack: Deployment Started
      # ---------------------------------
      - name: Slack - Deployment Started
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚀 *GRC3 DEV Backend deployment started*\n• Branch: dev-env\n• Triggered by: ${{ github.actor }}\n• Using SSM deployment..."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # ---------------------------------
      # 2. Configure AWS (OIDC)
      # ---------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ---------------------------------
      # 3. Deploy Backend via SSM
      # ---------------------------------
      - name: Deploy Backend on DEV EC2 (SSM)
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.DEV_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "GRC3 DEV Backend Deployment" \
            --parameters commands='[
              "sudo -u ubuntu bash -c \"\
                set -e

                cd /home/ubuntu/Dev_GRC/Backend-GRC3

                echo 🔄 Pulling latest backend code...

                git fetch origin dev-env
                git reset --hard origin/dev-env

                echo 📦 Installing backend dependencies...
                npm install --legacy-peer-deps --prefer-offline --progress=false

                echo 🏗️ Building backend...
                npm run build

                echo 🔁 Restarting Backend PM2...
                pm2 restart Dev-Backend

                echo ✅ Backend deployment completed
              \""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          # Poll deployment status
          for i in {1..120}; do

            STATUS=$(aws ssm list-command-invocations \
              --command-id $COMMAND_ID \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)

            echo "Current status: $STATUS"

            if [ "$STATUS" == "Success" ]; then
              echo "✅ Deployment SUCCESS"
              exit 0

            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ]; then

              echo "❌ Deployment FAILED"

              aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id "${{ secrets.DEV_INSTANCE_ID }}"

              exit 1
            fi

            sleep 5
          done

          echo "⏰ Timeout waiting for deployment"
          exit 1

      # ---------------------------------
      # Slack: Deployment Successful
      # ---------------------------------
      - name: Slack - Deployment Successful
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "✅ *GRC3 DEV Backend deployment successful*\n• Branch: dev-env\n• Deployed by: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # ---------------------------------
      # Slack: Deployment Failed
      # ---------------------------------
      - name: Slack - Deployment Failed
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🔥 *GRC3 DEV Backend deployment FAILED*\n• Branch: dev-env\n• Triggered by: ${{ github.actor }}\n• Check logs urgently!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
