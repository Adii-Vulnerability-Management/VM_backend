name: Backend CI/CD

on:
  push:
    branches: [main]

env:
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/vm-backend
  DEPLOY_PORT: "3102"

jobs:
  test:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run lint --if-present

  build-and-push:
    name: Build Docker Image & Push to Docker Hub
    needs: test
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg DOCKER_HOST_GID=109 \
            -t "$DOCKERHUB_IMAGE:${{ steps.tag.outputs.value }}" \
            -t "$DOCKERHUB_IMAGE:latest" .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker push "$DOCKERHUB_IMAGE:${{ steps.tag.outputs.value }}"
          docker push "$DOCKERHUB_IMAGE:latest"

  deploy:
    name: Deploy to Backend EC2
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull and run image on backend EC2
        env:
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          ssh -o StrictHostKeyChecking=no -i "${{ secrets.BACKEND_EC2_SSH_KEY_PATH }}" \
            "${{ vars.BACKEND_EC2_SSH_USER }}@${{ vars.BACKEND_EC2_PUBLIC_IP }}" bash -s << EOF
            set -e
            docker pull ${{ env.DOCKERHUB_IMAGE }}:$TAG
            docker stop vm-backend || true
            docker rm vm-backend || true
            docker run -d --name vm-backend \
              --restart unless-stopped \
              -p ${{ env.DEPLOY_PORT }}:3000 \
              --env-file /home/${{ vars.BACKEND_EC2_SSH_USER }}/vm-backend.env \
              -v /var/run/docker.sock:/var/run/docker.sock \
              ${{ env.DOCKERHUB_IMAGE }}:$TAG
          EOF