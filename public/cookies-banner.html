<!-- src/views/cookies-banner.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookie Consent</title>
    <style>
        #cookies-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #333;
            color: #fff;
            text-align: center;
            padding: 15px;
            z-index: 9999;
        }

        #cookies-banner button {
            margin-left: 10px;
            padding: 10px;
            cursor: pointer;
        }

        #cookies-banner button.accept {
            background: green;
            color: white;
        }

        #cookies-banner button.reject {
            background: red;
            color: white;
        }
    </style>
</head>

<body>
    <div id="cookies-banner">
        <span>We use cookies to ensure you get the best experience. By accepting, you agree to our terms.</span>
        <button class="accept" id="accept">Accept</button>
        <button class="reject" id="reject">Reject</button>
    </div>

    <script>
        document.getElementById('accept').addEventListener('click', () => {
            console.log('User accepted cookies.');
            document.getElementById('cookies-banner').style.display = 'none';
        });
        document.getElementById('reject').addEventListener('click', () => {
            console.log('User rejected cookies.');
            document.getElementById('cookies-banner').style.display = 'none';
        });
    </script>
</body>

</html>
